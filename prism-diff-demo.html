<!doctype html>
<!-- Prism 官方 Diff Highlight 插件的默认效果基准页：只加载官方 JS 与官方 CSS（不加载
     mdi2esm 的任何样式），用于随时对照「官方默认效果」，纠正实现偏差。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism 官方 Diff Highlight 默认效果</title>
    <link rel="stylesheet" href="./node_modules/prismjs/themes/prism.css" />
    <link rel="stylesheet" href="./node_modules/prismjs/plugins/diff-highlight/prism-diff-highlight.css" />
    <style>
      body {
        margin: 2rem auto;
        max-width: 46rem;
        font-family: ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }
      h1 {
        font-size: 1.25rem;
      }
      p {
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <h1>Prism 官方 Diff Highlight 插件默认效果</h1>
    <p>仅官方 JS + 官方 CSS，无 mdi2esm 样式。</p>

    <pre class="diff-highlight"><code class="language-diff">--- a/x.js
+++ b/x.js
@@ -1,3 +1,3 @@
 const a = 1;
-const b = 2;
+const c = 3;
 export default a;</code></pre>

    <pre class="diff-highlight"><code class="language-diff-javascript">--- a/x.js
+++ b/x.js
@@ -1,2 +1,2 @@
-const b = 2;
+const c = 3;</code></pre>

    <script src="./node_modules/prismjs/prism.js"></script>
    <script src="./node_modules/prismjs/components/prism-diff.js"></script>
    <script src="./node_modules/prismjs/plugins/diff-highlight/prism-diff-highlight.js"></script>
  </body>
</html>
