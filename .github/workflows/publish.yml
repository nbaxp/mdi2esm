# npm 发布工作流（Trusted Publishing / OIDC）+ GitHub Pages 部署
#
# 前置：
#   npm 包 Settings → Trusted Publisher → GitHub Actions，
#     工作流文件名填 publish.yml。
#   仓库 Settings → Pages → Source 选「GitHub Actions」。
#
# 推 v* Tag 会同时触发：
#   1. publish job：npm publish（OIDC）
#   2. pages job：构建 dist → upload artifact → deploy-pages
#      不再需要 gh-pages 分支

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # npm OIDC
  contents: read
  pages: write      # GitHub Pages
  attestations: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - run: npm ci

      - run: npm run lint

      - run: npm run build --if-present

      - run: npm test

      - run: npm publish --ignore-scripts

  pages:
    needs: publish
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
