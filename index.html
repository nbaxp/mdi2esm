<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdi2esm demo</title>
    <!--
      demo 页面：整页自包含，样式与脚本内联在本文件。
      - dev（npm run dev）：Vite 服务本文件，内联脚本里的裸导入（mdi2esm / vue / …）由 Vite
        重写到源码与 node_modules——引用全是非 dist 内容。
      - build（npm run build）：Vite 把本文件当入口打进 dist/，所有导入解析成打包产物，
        dist 自包含，`npm run preview` 或直接发布 GitHub Pages 都能跑，无需 importmap。
      - 渲染走 createMarkdownComponent（完整管线：frontmatter、Prism 高亮、KaTeX、script setup）。
      - 左列 textarea 编辑，右列实时预览（输入防抖 400ms），「渲染」按钮强制刷新，最右是大纲。
    -->
    <link rel="stylesheet" href="./src/styles/index.css" />
    <link rel="stylesheet" href="./node_modules/katex/dist/katex.min.css" />
    <style>
      /* demo 外壳专用样式（demo- 前缀，避免与 mdi2esm 的 .vp-doc 样式冲突）。
         markdown 正文与页内目录的样式来自库的 index.css，这里只负责页面骨架。 */
      /* 页面骨架：标准 header / content / footer 三行 flex。高度取视口（不写死 px），
         中间 flex:1 + min-height:0，三列在 main 内部各自全高滚动，页面本身不滚动。 */
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: var(--vp-c-bg);
        color: var(--vp-c-text-1);
        font-family: var(--vp-font-family-base);
      }

      .demo-header {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--vp-c-divider);
        background: var(--vp-c-bg);
      }

      .demo-footer {
        flex: none;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 20px;
        border-top: 1px solid var(--vp-c-divider);
        color: var(--vp-c-text-2);
        font-size: 12px;
      }

      .demo-header strong {
        font-size: 16px;
      }

      .demo-header button,
      .demo-header select {
        border: 1px solid var(--vp-c-divider);
        background: var(--vp-c-bg-soft);
        color: var(--vp-c-text-1);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
        font-size: 13px;
      }

      .demo-driver {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--vp-c-text-2);
        font-size: 13px;
      }

      .demo-header label.demo-toc {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--vp-c-text-2);
        font-size: 13px;
        cursor: pointer;
      }

      .demo-header label.demo-toc select {
        padding: 3px 6px;
      }

      .demo-main {
        flex: 1;
        min-height: 0;
        display: grid;
        /* minmax(0, 1fr)：避免长代码块等内容的 min-content 把中列撑大、挤压左列 */
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 220px;
        gap: 16px;
        padding: 16px 20px;
      }

      .demo-main > section {
        display: flex;
        flex-direction: column;
        min-height: 0;
        /* flex/grid 子项默认 min-width:auto，会被长代码块等 min-content 撑宽整列 */
        min-width: 0;
      }

      .demo-aside {
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }

      .demo-col-title {
        flex: none;
        margin: 0 0 6px;
        color: var(--vp-c-text-2);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .demo-src {
        box-sizing: border-box;
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--vp-c-divider);
        border-radius: 8px;
        background: var(--vp-c-bg-soft);
        color: var(--vp-c-text-1);
        font-family: var(--vp-font-family-mono);
        font-size: 12px;
        line-height: 1.6;
        tab-size: 2;
        resize: none;
      }

      .demo-rendered {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow: auto;
        border: 1px solid var(--vp-c-divider);
        border-radius: 8px;
        background: var(--vp-c-bg);
        color: var(--vp-c-text-1);
      }

      /* 库样式 .vp-doc 带 max-width:48rem 与 margin:0 auto；在 flex 子项里
         auto 外边距会让宽度按内容收缩，溢出中列。构建后本 style 会被提到
         link 的库 CSS 之前，单类选择器盖不住同优先级的 .vp-doc，故用双类。 */
      .demo-rendered.vp-doc {
        max-width: none;
        margin: 0;
        /* 官方靠外层 .VPDoc 的 padding-inline 容纳标题锚点（.header-anchor 左移
           -0.87em）。本 demo 把 .vp-doc 直接放进 overflow:auto 的滚动容器，
           没有那层 padding，# 会探出容器左界被裁；这里补齐（对齐官方响应式值）。 */
        padding-inline: 1.5rem;
      }

      @media (min-width: 48rem) {
        .demo-rendered.vp-doc {
          padding-inline: 2rem;
        }
      }

      /* demo 的滚动容器没有吸顶导航，锚点偏移缩小到视觉舒适值 */
      .demo-rendered [id] {
        scroll-margin-top: 12px;
      }

      /* 页内大纲：demo 三栏全高布局，大纲占满栏高、内部滚动（不吸顶）。
         用 relative 而非 static：.outline-marker 是 absolute，需要大纲做包含块 */
      #outline {
        position: relative;
        height: 100%;
      }

      /* 短码生成的 <Icon> 是 svg：doc.css 里 svg 按块级排（图片语义），
         行内图标要跟随文字，这里在 demo 侧补一条，不影响库样式 */
      .vp-doc p svg,
      .vp-doc li > svg,
      .vp-doc h2 svg,
      .vp-doc h3 svg {
        display: inline-block;
        vertical-align: -0.125em;
      }

      /* 自定义容器：库只产出 .demo.custom-block 的结构（border 透明、无背景），
         配色属于宿主主题，库不内置未知类型的色板。这里给 demo 用品牌色做示例 */
      .vp-doc .custom-block.demo {
        border-color: var(--vp-c-brand-1);
        background-color: var(--vp-c-brand-soft);
      }

      .vp-doc .custom-block.demo .custom-block-title {
        color: var(--vp-c-brand-1);
      }

      /* 图片放大：medium-zoom 的遮罩跟随主题，宿主自己装、自己管样式 */
      .medium-zoom-overlay {
        background: var(--vp-c-bg) !important;
        z-index: 100;
      }

      .medium-zoom-image--opened {
        z-index: 101;
      }
      /* ---- 页内 [[toc]] ---- */
      /* 默认输出是 <nav class="table-of-contents"><ul><li><a>…，只继承 .vp-doc 的
   列表圆点与链接样式，这里改成无项目符号、可嵌套的卡片式目录。 */
      .vp-doc .table-of-contents {
        margin: 1.5rem 0;
        padding: 0.75rem 1rem;
        border: 1px solid var(--vp-c-divider);
        border-radius: 8px;
        background-color: var(--vp-c-bg-soft);
        font-size: 13px;
        line-height: 1.5;
      }

      .vp-doc .table-of-contents ul {
        margin: 0;
        padding-inline-start: 0;
        list-style: none;
      }

      .vp-doc .table-of-contents ul ul {
        margin-top: 0.125rem;
        padding-inline-start: 1rem;
      }

      .vp-doc .table-of-contents li {
        margin: 0;
      }

      .vp-doc .table-of-contents a {
        display: block;
        padding: 3px 0;
        color: var(--vp-c-text-2);
        font-weight: 400;
        text-decoration: none;
      }

      .vp-doc .table-of-contents a:hover {
        color: var(--vp-c-brand-1);
        text-decoration: none;
      }

      .vp-doc .table-of-contents a:focus-visible {
        outline: 2px solid var(--vp-c-brand-1);
        outline-offset: 2px;
        border-radius: 2px;
      }

      /* 自动编号（config.markdown.toc.showAutoNumber）：标题与目录共用 */
      .vp-doc .toc-number {
        margin-inline-end: 0.35em;
        color: var(--vp-c-text-2);
        font-variant-numeric: tabular-nums;
      }

      /* ---- 时间线（:::timeline） ---- */
      .vp-doc .mdi-timeline {
        margin: 1em 0;
        padding: 16px 20px;
        border: 1px solid var(--vp-c-divider);
        border-radius: 8px;
      }

      .vp-doc .mdi-timeline__header {
        margin-bottom: 12px;
        font-weight: 600;
        font-size: 1.05em;
      }

      .vp-doc .mdi-timeline__item {
        position: relative;
        padding-left: 22px;
        padding-bottom: 16px;
      }

      .vp-doc .mdi-timeline__item:last-child {
        padding-bottom: 0;
      }

      /* 竖向连接线（节点之间） */
      .vp-doc .mdi-timeline__item::before {
        content: '';
        position: absolute;
        left: 5px;
        top: 16px;
        bottom: -2px;
        width: 1px;
        background: var(--vp-c-divider);
      }

      .vp-doc .mdi-timeline__item:last-child::before {
        display: none;
      }

      .vp-doc .mdi-timeline__node {
        position: absolute;
        left: 0;
        top: 5px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--vp-c-text-3);
      }

      .vp-doc .mdi-timeline__item--done .mdi-timeline__node {
        background: var(--vp-c-success-1, #16a34a);
      }

      .vp-doc .mdi-timeline__item--doing .mdi-timeline__node {
        background: var(--vp-c-brand-1, #3b82f6);
      }

      .vp-doc .mdi-timeline__item--milestone .mdi-timeline__node {
        background: var(--vp-c-brand-1, #3b82f6);
        box-shadow: 0 0 0 3px var(--vp-c-brand-soft, rgba(59, 130, 246, 0.2));
      }

      .vp-doc .mdi-timeline__item--error .mdi-timeline__node {
        background: var(--vp-c-danger-1, #dc2626);
      }

      .vp-doc .mdi-timeline__time {
        color: var(--vp-c-text-2);
        font-size: 0.85em;
      }

      .vp-doc .mdi-timeline__title {
        font-weight: 600;
      }

      .vp-doc .mdi-timeline__desc {
        color: var(--vp-c-text-2);
      }

      .vp-doc .mdi-timeline__desc > :first-child {
        margin-top: 0;
      }

      .vp-doc .mdi-timeline__desc > :last-child {
        margin-bottom: 0;
      }

      /* ---- 页内目录（边栏） ---- */
      /* 数值与 VitePress 的 VPDocAsideOutline / VPDocOutlineItem 保持一致：
   1px 发丝线、1rem 内缩、容器 13px/500、链接 14px/400/行高 2.2857143、
   独立 2px 品牌色标记。当前项在 VitePress 基础上再加强：品牌色文字 + 600 字重，
   避免与 hover 的 text-1 混淆、保证弱对比环境下也可辨。 */
      .vp-doc-outline {
        overflow-y: auto;
        overscroll-behavior: contain;
        border-inline-start: 1px solid var(--vp-c-divider);
        padding-inline-start: 1rem;
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .vp-doc-outline .outline-marker {
        position: absolute;
        top: 0;
        inset-inline-start: 0;
        z-index: 0;
        width: 2px;
        height: 1.125rem;
        border-radius: 2px;
        background-color: var(--vp-c-brand-1);
        opacity: 0;
        transition:
          top 0.25s cubic-bezier(0, 1, 0.5, 1),
          background-color 0.5s,
          opacity 0.25s;
      }

      .vp-doc-outline .vp-doc-outline-title {
        line-height: 2.2857143;
        font-size: 0.875rem;
        font-weight: 600;
      }

      .vp-doc-outline a {
        position: relative;
        z-index: 1;
        display: block;
        color: var(--vp-c-text-2);
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 2.2857143;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.5s;
      }

      .vp-doc-outline a:hover {
        color: var(--vp-c-text-1);
        transition: color 0.25s;
      }

      .vp-doc-outline a.active,
      .vp-doc-outline a[aria-current='location'] {
        color: var(--vp-c-brand-1);
        font-weight: 600;
        transition: color 0.25s;
      }

      .vp-doc-outline a:focus-visible {
        outline: 2px solid var(--vp-c-brand-1);
        outline-offset: 2px;
        border-radius: 2px;
      }

      .vp-doc-outline .lvl-2 {
        padding-inline-start: 0;
      }

      .vp-doc-outline .lvl-3 {
        padding-inline-start: 1rem;
      }

      .vp-doc-outline .lvl-4 {
        padding-inline-start: 2rem;
      }

      /* ---- Mermaid / 数学占位 ---- */
      /* pele 的 --pele-* 配色变量由 MermaidBlock 组件内联（src/mermaid.js）从 --vp-* 派生，
   不依赖本 CSS：宿主只引 JS 时暗色模式同样生效 */
      .vp-doc .mermaid-rendered {
        margin: 1rem 0;
        overflow-x: auto;
      }

      /* ECharts 容器：高度由组件内联（config.echarts.height），宽度自适应 */
      .vp-doc .echarts-rendered {
        margin: 1rem 0;
        overflow-x: auto;
      }

      /* ECharts 降级源码：与 mermaid-source 同款卡片 */
      .vp-doc .echarts-source {
        margin: 1rem 0;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: var(--vp-code-block-bg);
        font-family: var(--vp-font-family-mono);
        font-size: var(--vp-code-font-size);
      }

      /* 表格转图表：容器宽度撑满，高度由组件内联 */
      .vp-doc .echarts-table-chart {
        width: 100%;
      }

      .vp-doc .mermaid-source {
        margin: 1rem 0;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: var(--vp-code-block-bg);
        font-family: var(--vp-font-family-mono);
        font-size: var(--vp-code-font-size);
      }

      .vp-doc .md-math-placeholder[data-display='true'] {
        display: block;
        margin: 1rem 0;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <header class="demo-header">
      <strong>mdi2esm</strong>
      <label class="demo-driver">
        图表驱动
        <select id="diagram-driver">
          <option value="pele" selected>Pele（默认）</option>
          <option value="mermaid">Mermaid</option>
        </select>
      </label>
      <label class="demo-toc">
        <input type="checkbox" id="toc-number" />
        目录编号
      </label>
      <label class="demo-toc">
        <input type="checkbox" id="toc-multi" checked />
        允许多目录
      </label>
      <label class="demo-toc">
        <input type="checkbox" id="external-icon" />
        外链图标
      </label>
      <label class="demo-toc">
        目录层级
        <select id="toc-level">
          <option value="2,3" selected>H2–H3（默认）</option>
          <option value="2,6">H2–H6</option>
          <option value="1,2">H1–H2</option>
          <option value="1,6">H1–H6</option>
        </select>
      </label>
      <button id="render">渲染</button>
      <button id="toggle-theme">深色</button>
    </header>
    <main class="demo-main">
      <section>
        <p class="demo-col-title">Markdown 源（demo.md，可编辑）</p>
        <textarea id="src" class="demo-src" spellcheck="false" wrap="off"></textarea>
      </section>
      <section>
        <p class="demo-col-title">渲染结果</p>
        <div id="content" class="demo-rendered vp-doc"></div>
      </section>
      <aside class="demo-aside">
        <nav id="outline" class="vp-doc-outline"></nav>
      </aside>
    </main>
    <footer class="demo-footer">
      <span>mdi2esm <span id="version"></span></span>
      <span>VitePress 风格 Markdown 渲染管线 · 左编辑右预览</span>
    </footer>

    <script type="module">
      // ===== demo 全部逻辑（原 demo/vp-badge.js + demo/main.js，内联成单文件页面） =====

      // 宿主侧的徽标组件（复制自 mdoc 的 theme/components/VPBadge.js）。
      // mdi2esm 不内置 Badge：宿主提供组件，编译后经渲染组件的 components 注入。
      // 1:1 移植 VitePress VPBadge.vue（原版：
      // https://github.com/vuejs/vitepress/blob/v2.0.0-alpha.21/src/client/theme-default/components/VPBadge.vue）
      import styleMixin from 'vue-style-runtime';

      const BADGE_CSS = `
.VPBadge {
  display: inline-block;
  margin-inline-start: 0.125rem;
  border: 1px solid transparent;
  border-radius: 0.75rem;
  padding: 0 0.625rem;
  line-height: 1.8333333;
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
  transform: translateY(-0.125rem);
}

.VPBadge.small {
  padding: 0 0.375rem;
  line-height: 1.8;
  font-size: 0.625rem;
  transform: translateY(-0.5rem);
}

.VPDocFooter .VPBadge {
  display: none;
}

.vp-doc h1 > .VPBadge,
.vp-doc h2 > .VPBadge {
  margin: 0;
  margin-inline-start: 0.125rem;
  vertical-align: middle;
}

.vp-doc h2 > .VPBadge {
  padding: 0 0.5rem;
}

.vp-doc h3 > .VPBadge {
  vertical-align: middle;
}

.vp-doc h4 > .VPBadge,
.vp-doc h5 > .VPBadge,
.vp-doc h6 > .VPBadge {
  vertical-align: middle;
  line-height: 1.5;
}

.VPBadge.info {
  border-color: var(--vp-badge-info-border);
  color: var(--vp-badge-info-text);
  background-color: var(--vp-badge-info-bg);
}

.VPBadge.note {
  border-color: var(--vp-badge-note-border);
  color: var(--vp-badge-note-text);
  background-color: var(--vp-badge-note-bg);
}

.VPBadge.tip {
  border-color: var(--vp-badge-tip-border);
  color: var(--vp-badge-tip-text);
  background-color: var(--vp-badge-tip-bg);
}

.VPBadge.important {
  border-color: var(--vp-badge-important-border);
  color: var(--vp-badge-important-text);
  background-color: var(--vp-badge-important-bg);
}

.VPBadge.caution {
  border-color: var(--vp-badge-caution-border);
  color: var(--vp-badge-caution-text);
  background-color: var(--vp-badge-caution-bg);
}

.VPBadge.warning {
  border-color: var(--vp-badge-warning-border);
  color: var(--vp-badge-warning-text);
  background-color: var(--vp-badge-warning-bg);
}

.VPBadge.danger {
  border-color: var(--vp-badge-danger-border);
  color: var(--vp-badge-danger-text);
  background-color: var(--vp-badge-danger-bg);
}
`;

      const VPBadge = {
        mixins: [styleMixin],
        props: {
          text: { type: String, required: false },
          type: { type: String, required: false, default: 'tip' },
        },
        template: /* HTML */ `
          <span class="VPBadge" :class="type" dir="auto">
            <slot>{{ text }}</slot>
          </span>
        `,
        styles: /* HTML */ `<style scoped>
          ${BADGE_CSS}
        </style>`,
      };

      // ===== 页面主体 =====
      import { Icon } from '@iconify/vue';
      import { buildOutline, createConfig, createMarkdownComponent } from 'mdi2esm';
      import { createApp, h, nextTick, shallowRef, watch } from 'vue';
      import pkg from './package.json';

      document.getElementById('version').textContent = `v${pkg.version}`;

      // 注入的唯一入口：md 里用到的 <Icon> / <Badge> 全在这里登记，库内一个都不含。
      // Icon 来自 Iconify；VPBadge 是宿主自己写的组件（内联在本文件上方）。
      const HOST_COMPONENTS = { Icon, Badge: VPBadge };

      const ta = document.getElementById('src');
      const content = document.getElementById('content');
      const outline = document.getElementById('outline');

      // demo.md 是本 demo 可编辑示例的初始值；运行时取，不靠构建期内联
      // 示例源：dev 取根目录 demo.md（源码实时可改），build 后取 dist/demo.md
      const readme = await fetch('./demo.md').then((res) => res.text());
      ta.value = readme;

      // 目录配置：URL 参数驱动。md 是模块级单例，配置在首次渲染时锁定
      //（assertConfigCompatible 对后续不同配置只 warn 且首份生效），所以改动需重新加载页面
      const params = new URLSearchParams(location.search);
      const parseLevels = (value, fallback) => {
        const parts = String(value ?? '')
          .split(',')
          .map((item) => Number(item.trim()))
          .filter((item) => item >= 1 && item <= 6);
        return parts.length === 2 ? parts : fallback;
      };
      const toc = {
        level: parseLevels(params.get('tocLevel'), [2, 3]),
        showAutoNumber: params.get('tocNumber') === '1',
        allowMultiToc: params.get('tocMulti') !== '0',
      };

      // 自定义容器：由 config 驱动（非纯 Markdown 语法），演示 ::: demo
      const config = createConfig({
        markdown: {
          lineNumbers: false,
          container: [{ type: 'demo', title: '自定义容器' }],
          toc,
        },
      });

      // 页面唯一的 Vue 状态：md 文本与图表驱动。改它就会重新编译
      const source = shallowRef(readme);
      const driver = shallowRef('pele');
      // 当前编译出来的渲染组件
      const view = shallowRef(null);

      let marker = null;
      let spyLinks = [];
      let spyTargets = [];
      let spyRaf = 0;
      let spyLines = new Map();

      // 大纲层级交给 .vp-doc-outline .lvl-N 控制，不写内联样式
      function renderOutline(items, container, level = 2) {
        for (const it of items) {
          const a = document.createElement('a');
          a.href = it.link;
          a.textContent = it.title;
          a.className = `lvl-${Math.min(level, 4)}`;
          a.dataset.target = it.link.slice(1);
          container.append(a);
          renderOutline(it.children || [], container, level + 1);
        }
      }

      // 与 VitePress 的 .outline-title 对齐
      function createTitle(container) {
        const title = document.createElement('div');
        title.className = 'vp-doc-outline-title';
        title.textContent = '大纲';
        container.append(title);
      }

      // 与 VitePress 的 .outline-marker 对齐：独立元素，由 JS 定位到当前项
      function createMarker(container) {
        marker = document.createElement('div');
        marker.className = 'outline-marker';
        container.append(marker);
      }

      // 滚动同步：取最后一个越过容器顶部的标题，对应链接打上 .active
      function collectOutlineTargets() {
        spyLinks = [...outline.querySelectorAll('a')];
        spyTargets = spyLinks.map((a) => document.getElementById(a.dataset.target));
      }

      // 左栏源码同步：按当前标题的源码行滚动 textarea（wrap=off，行号→像素线性）。
      // 顶部对齐：目标行落在视口首行，与右栏标题在顶部的语义一致
      function syncSourceScroll(slug) {
        const line = spyLines.get(slug);
        if (!line) return;
        const style = getComputedStyle(ta);
        const lineHeight = parseFloat(style.lineHeight) || 19.2;
        const pad = parseFloat(style.paddingTop) || 0;
        const top = pad + (line - 1) * lineHeight;
        ta.scrollTop = Math.max(0, Math.min(top, ta.scrollHeight - ta.clientHeight));
      }

      function updateActive() {
        spyRaf = 0;
        if (!spyLinks.length) return;
        if (!spyTouched) {
          spyLinks.forEach((a) => a.classList.remove('active'));
          if (marker) marker.style.opacity = '0';
          return;
        }
        const threshold = content.getBoundingClientRect().top + 16;
        let index = 0;
        for (let i = 0; i < spyTargets.length; i += 1) {
          const el = spyTargets[i];
          if (el && el.getBoundingClientRect().top <= threshold) index = i;
        }
        spyLinks.forEach((a, i) => a.classList.toggle('active', i === index));

        const active = spyLinks[index];
        if (!active) return;
        syncSourceScroll(active.dataset.target);
        if (marker) {
          marker.style.top = `${active.offsetTop + (active.offsetHeight - marker.offsetHeight) / 2}px`;
          marker.style.opacity = '1';
        }
        // 目录自身滚动时把当前项带回视野
        const viewTop = outline.scrollTop;
        const viewBottom = viewTop + outline.clientHeight;
        if (active.offsetTop < viewTop) {
          outline.scrollTop = active.offsetTop;
        } else if (active.offsetTop + active.offsetHeight > viewBottom) {
          outline.scrollTop = active.offsetTop + active.offsetHeight - outline.clientHeight;
        }
      }

      function scheduleActive() {
        if (spyRaf) return;
        spyRaf = requestAnimationFrame(updateActive);
      }

      // 刚进入（未滚动）不设当前态；点击/锚点跳转、手动滚动都会触发 scroll，之后才有高亮
      let spyTouched = false;
      content.addEventListener(
        'scroll',
        () => {
          spyTouched = true;
          scheduleActive();
        },
        { passive: true },
      );
      window.addEventListener('resize', scheduleActive);

      // 正文在 .demo-rendered 独立滚动容器里，浏览器对 #id 的锚点跳转只滚 window，
      // 预览区不会动。这里统一接管：滚动预览区到目标标题（点击与带锚点刷新共用）。
      // 懒加载图片在跳转后才加载，高度变化会让目标位置失准；先让正文图片全部就绪，
      // 再一次性滚动到位（超时兜底，避免个别图片失败导致不跳转）。
      const scrollToTarget = (id, behavior) => {
        const el = document.getElementById(id);
        if (!el) return;
        const align = () => {
          const top = el.getBoundingClientRect().top - content.getBoundingClientRect().top + content.scrollTop - 12;
          content.scrollTo({ top, behavior });
          // 锚点进入/点击跳转后立即同步左栏与当前态（scroll 事件未必触发，如目标本就在首屏）
          spyTouched = true;
          scheduleActive();
        };
        const imgs = [...content.querySelectorAll('img')];
        imgs.forEach((img) => {
          img.loading = 'eager';
        });
        const pending = imgs
          .filter((img) => !img.complete)
          .map(
            (img) =>
              new Promise((resolve) => {
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
              }),
          );
        Promise.race([Promise.all(pending), new Promise((resolve) => setTimeout(resolve, 2000))]).then(() => {
          align();
          if (behavior === 'auto') {
            // 首帧定位时图表/图片等异步内容会让高度继续变化，轮询内容高度、
            // 连续稳定后按最终高度收尾校正（超时兜底）
            let lastH = content.scrollHeight;
            let stable = 0;
            const timer = setInterval(() => {
              const h = content.scrollHeight;
              if (h === lastH) {
                stable += 1;
                if (stable >= 3) {
                  clearInterval(timer);
                  align();
                }
              } else {
                lastH = h;
                stable = 0;
                align();
              }
            }, 150);
            setTimeout(() => {
              clearInterval(timer);
              align();
            }, 4000);
          }
        }, align);
      };

      outline.addEventListener('click', (event) => {
        const a = event.target.closest('a');
        if (!a || !a.dataset.target) return;
        if (!document.getElementById(a.dataset.target)) return;
        event.preventDefault();
        history.replaceState(null, '', a.getAttribute('href'));
        scrollToTarget(a.dataset.target, 'smooth');
      });

      // 编译完得到的 headings：右侧大纲就地重建
      async function onHeadings(headings) {
        outline.innerHTML = '';
        createTitle(outline);
        createMarker(outline);
        renderOutline(buildOutline(headings), outline);
        // 标题元素要等新组件 patch 进 DOM 才取得到
        await nextTick();
        collectOutlineTargets();
        spyLines = new Map(headings.map((h) => [h.slug, h.line]));
        scheduleActive();
        // 带锚点刷新（如 #时间线）：浏览器只滚 window，这里在首帧按 hash 定位到预览区，
        // 高亮由滚动事件触发同步；仅处理一次，编辑重编译不会反复跳走
        if (!initialHashHandled) {
          initialHashHandled = true;
          const id = decodeURIComponent(location.hash.slice(1));
          if (id) scrollToTarget(id, 'auto');
        }
      }
      let initialHashHandled = false;

      // 文本变了就重编译：按序号丢弃过期结果，编译完再替换视图
      let compileSeq = 0;
      async function rebuild() {
        const seq = ++compileSeq;
        try {
          const { component, headings } = await createMarkdownComponent(source.value, '', {
            ...config,
            mermaidDriver: driver.value,
          });
          if (seq !== compileSeq) return;
          if (!component) {
            view.value = null;
            await onHeadings(headings);
            return;
          }
          component.components = { ...(component.components || {}), ...HOST_COMPONENTS };
          view.value = component;
          await onHeadings(headings);
        } catch (err) {
          if (seq === compileSeq) fail(err);
        }
      }

      // 整个页面只有一个 Vue 应用，视图就是每次编译出来的组件
      const Root = {
        setup() {
          return () => (view.value ? h(view.value) : null);
        },
      };

      function fail(err) {
        content.textContent = '渲染失败：' + err.message;
        console.error(err);
      }

      // 挂载后由 rebuild 接管：文本变了就重编译，大纲由 onHeadings 重建
      try {
        createApp(Root).mount(content);
        watch([source, driver], rebuild);
        await rebuild();
      } catch (err) {
        fail(err);
      }

      // 左编辑右预览：输入防抖 400ms 实时刷新，文本没变时 shallowRef 不触发，不会白跑编译
      let inputTimer = 0;
      ta.addEventListener('input', () => {
        clearTimeout(inputTimer);
        inputTimer = setTimeout(() => {
          source.value = ta.value;
        }, 400);
      });

      // 「渲染」按钮：跳过防抖立即刷新
      document.getElementById('render').addEventListener('click', () => {
        clearTimeout(inputTimer);
        source.value = ta.value;
      });
      // 目录控件：改了就把配置写进 URL 并重新加载（单例限制，见上）
      const tocNumber = document.getElementById('toc-number');
      const tocMulti = document.getElementById('toc-multi');
      const tocLevel = document.getElementById('toc-level');
      tocNumber.checked = toc.showAutoNumber;
      tocMulti.checked = toc.allowMultiToc;
      tocLevel.value = toc.level.join(',');
      for (const el of [tocNumber, tocMulti, tocLevel]) {
        el.addEventListener('change', () => {
          const next = new URLSearchParams(location.search);
          if (tocNumber.checked) next.set('tocNumber', '1');
          else next.delete('tocNumber');
          next.set('tocMulti', tocMulti.checked ? '1' : '0');
          if (!tocLevel.value || tocLevel.value === '2,3') next.delete('tocLevel');
          else next.set('tocLevel', tocLevel.value);
          location.assign(`${location.pathname}${next.size ? `?${next}` : ''}`);
        });
      }
      document.getElementById('diagram-driver').addEventListener('change', (event) => {
        driver.value = event.target.value;
      });
      // 外链图标：官方 externalLinkIcon 配置对应给 .vp-doc 祖先加 .external-link-icon-enabled
      // class，CSS 的 ::after 才渲染图标（默认关闭）。这里切换该 class 演示这个配置项；
      // 加在 #content 的父 section（即 .vp-doc 的祖先）上，符合官方选择器层级要求。
      const externalIconToggle = document.getElementById('external-icon');
      externalIconToggle.addEventListener('change', () => {
        document
          .getElementById('content')
          .parentElement.classList.toggle('external-link-icon-enabled', externalIconToggle.checked);
      });
      document.getElementById('toggle-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });
    </script>
  </body>
</html>
