<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdi2esm demo</title>
    <!--
      全面 demo：示例源来自独立的 demo/sample.md（?raw 载入，可实时编辑）。
      渲染走 createMarkdownComponent 完整管线（含 frontmatter、Prism 高亮、KaTeX、script setup），
      由 Vue createApp 挂载。样式走 mdi2esm 自带的 src/styles/index.css。
      本文件只保留页面骨架，逻辑见 demo/main.js，外壳样式见 demo/demo.css。
    -->
  </head>
  <body>
    <header class="demo-header">
      <strong>mdi2esm</strong>
      <span>全面 demo · 独立 md 源 · 完整渲染管线</span>
      <button id="render">渲染</button>
      <button id="toggle-theme">深色</button>
    </header>
    <main class="demo-main">
      <section>
        <p class="demo-col-title">Markdown 源（demo/sample.md）</p>
        <textarea id="src" class="demo-src" spellcheck="false"></textarea>
      </section>
      <section>
        <p class="demo-col-title">渲染结果</p>
        <div id="content" class="demo-rendered vp-doc"></div>
      </section>
      <aside>
        <nav id="outline" class="vp-doc-outline"></nav>
      </aside>
    </main>

    <script type="module" src="./demo/main.js"></script>
  </body>
</html>
