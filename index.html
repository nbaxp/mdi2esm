<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>markdown-rt demo</title>
    <!-- 完整打包版外部化框架与重依赖（vue / vue-style-runtime / katex / mermaid / medium-zoom / shiki /
         @shikijs/transformers），由消费方提供。本页由 Vite 构建（build.mjs）：
         以 dist/index.min.js 为依赖入口，Vite 自动解析这些裸包并 bundle 进 demo，无需 importmap/vendor。 -->
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--vp-c-text-1);
        background: var(--vp-c-bg);
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--vp-c-divider);
        display: flex;
        gap: 12px;
        align-items: center;
      }
      header span {
        color: var(--vp-c-text-2);
        font-size: 13px;
      }
      button {
        border: 1px solid var(--vp-c-divider);
        background: var(--vp-c-bg-soft);
        color: var(--vp-c-text-1);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr 220px;
        gap: 16px;
        padding: 16px 20px;
        align-items: start;
      }
      textarea {
        width: 100%;
        height: 78vh;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        border: 1px solid var(--vp-c-divider);
        border-radius: 8px;
        padding: 12px;
        background: var(--vp-c-bg-soft);
        color: var(--vp-c-text-1);
        resize: vertical;
      }
      .rendered {
        border: 1px solid var(--vp-c-divider);
        border-radius: 8px;
        padding: 0 16px;
        overflow: auto;
        height: 78vh;
      }
      .col-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--vp-c-text-2);
        margin: 0 0 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>markdown-rt</strong>
      <span>完整打包版 demo（dist/index.min.js；外部 peer 由 Vite 构建时自动解析并 bundle）</span>
      <button id="render">渲染</button>
      <button id="toggle-theme">深色</button>
    </header>
    <main>
      <section>
        <p class="col-title">Markdown 源</p>
        <textarea id="src" spellcheck="false"></textarea>
      </section>
      <section>
        <p class="col-title">渲染结果</p>
        <div id="content" class="rendered vp-doc"></div>
      </section>
      <aside>
        <p class="col-title">大纲</p>
        <nav id="outline" class="vp-doc-outline"></nav>
      </aside>
    </main>

    <script type="module">
      // demo 样式走 src 源文件与 peer，由 Vite 构建时 bundle 进 assets，不依赖 dist 里的发布产物副本
      import './src/styles/markdown-rt.css';
      // katex 是 peer：CSS/字体由 katex 包提供，Vite 构建时解析并 bundle 进 assets
      import 'katex/dist/katex.min.css';
      import {
        renderMarkdown,
        renderMath,
        mountMermaid,
        mountImageZoom,
        buildOutline,
        createConfig,
      } from './dist/index.min.js';

      const SAMPLE = `---
title: 示例文档
---

# 标题一
## 标题二
内容段落，支持 **加粗**、*斜体*、\`行内代码\` 与 [链接](https://example.com)。

## 自定义容器
::: tip
这是一个 tip 提示块。
:::
::: warning
这是一个 warning 警告块。
:::
::: danger
危险操作。
:::
::: details 点击展开
折叠内容。
:::

## 代码高亮
\`\`\`js
const a = 1;
console.log(a);
\`\`\`

## 数学公式
行内 $E = mc^2$，块级：
$$
\\int_0^1 x^2 \\, dx = \\frac{1}{3}
$$

## 图表
\`\`\`mermaid
graph TD; A-->B; B-->C;
\`\`\`

## 图片
![示意图](https://picsum.photos/600/300)
`;

      const ta = document.getElementById('src');
      const out = document.getElementById('content');
      const outline = document.getElementById('outline');
      ta.value = SAMPLE;

      const config = createConfig();

      function renderOutline(items, container) {
        for (const it of items) {
          const a = document.createElement('a');
          a.href = it.link;
          a.textContent = it.title;
          a.style.display = 'block';
          container.append(a);
          if (it.children && it.children.length) {
            const childNav = document.createElement('div');
            childNav.style.paddingLeft = '12px';
            container.append(childNav);
            renderOutline(it.children, childNav);
          }
        }
      }

      async function run() {
        const { html, headings } = renderMarkdown(ta.value, { dir: '', config });
        const finalHtml = await renderMath(html, config);
        out.innerHTML = finalHtml;
        mountMermaid();
        mountImageZoom();
        outline.innerHTML = '';
        renderOutline(buildOutline(headings), outline);
      }

      document.getElementById('render').addEventListener('click', run);
      document.getElementById('toggle-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });
      run();
    </script>
  </body>
</html>
